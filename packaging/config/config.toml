# Gideon configuration.
# System defaults live here; override per-user in ~/.config/gideon/config.toml

[audio]
# input_device  = "alsa_input.pci-0000_00_1f.3.analog-stereo"
# output_device = "default"
sample_rate = 16000

[vad]
vad_threshold   = 0.5     # silero speech probability floor
silence_end_ms  = 700     # trailing silence that ends an utterance
max_segment_s   = 15.0

[stt]
whisper_model   = "base.en"   # tiny.en is ~1.6x faster and noticeably worse on
                              # short, quiet or accented speech
whisper_compute = "int8"
whisper_threads = 4

[wake]
# Whisper hears "Gideon" as "get in" - consistently, at every model size. That
# whole family of mishearings is handled by the consonant-skeleton matcher in
# nlu/wake.py, which folds "get in", "guidion", "giddy on" and "kidin" onto the
# same code as "gideon"; the list no longer has to enumerate them.
# What this list IS: the ways of ADDRESSING Gideon. A candidate must open with a
# word resembling one of these first words, which is what stops "get in the car"
# from waking him. Add an entry for a new greeting, not a new mishearing.
wake_phrases = ["hey gideon", "hi gideon", "ok gideon", "a gideon", "gideon"]
wake_fuzz    = 0.84       # lower = easier to trigger, more false accepts.
                          # Measured: below 0.84 "they didn't say" and "a good
                          # idea" start waking him.

[speaker]
# Who may wake Gideon. The wake phrase is matched in the TRANSCRIPT, so without
# this anyone in the room who says "hey gideon" is answered. Run `gideon --enroll`
# (with the daemon stopped) to record your voiceprint; until you do, verification
# stays off and says so on the tray's "Voice lock" row - it fails open on purpose,
# so a failed model download cannot silently stop Gideon answering you.
speaker_verify    = true
# Cosine similarity floor against your enrolled voiceprint. Measured with a
# 5-phrase enrollment: the owner scores 0.66 on a bare "hey gideon" and 0.81-0.85
# on a full sentence, while other speakers saying the same words score -0.22 to
# 0.13. Raise towards 0.60 for a stricter door and the occasional repeated wake
# phrase; lower it if your own voice is being turned away.
speaker_threshold = 0.45
# Also verify inside the follow-up window. Off by default because the window can
# only be open after a turn that was already verified - but while it is open,
# anyone in the room can speak into it. Turn this on to close that gap.
speaker_verify_followup = false

[conversation]
# Seconds after a reply during which Gideon answers without the wake phrase, so a
# back-and-forth does not need "hey gideon" on every sentence. Say "stop", "never
# mind" or "thanks" to close the window early.
followup_window_s = 8.0

[llm]
# Tier 1 brain. Entirely optional: if Ollama is not installed or not running,
# Gideon logs it once and falls back to the built-in greetings. Nothing breaks.
#   curl -fsSL https://ollama.com/install.sh | sh
#   ollama pull llama3.2:1b
#
# Use a NON-reasoning model. qwen3 and deepseek-r1 spend their entire token budget
# on chain-of-thought before answering: 15-20 s per reply on a laptop CPU, versus
# ~0.5 s for llama3.2:1b. Measured on an i7-1165G7: 1b = 0.5 s simple / 1.7 s hard,
# 3b = 2.0 s / 4.3 s. Both answer the same questions correctly.
llm_enabled = true
llm_url     = "http://127.0.0.1:11434"
llm_model   = "llama3.2:1b"   # "llama3.2:3b" is ~2.5x slower, marginally better
llm_timeout = 30.0

# Where Tier 1 answers come from: "ollama", "cerebras" or "openrouter".
#
# "ollama" is the default and the only one that keeps Gideon fully offline. The
# other two are cloud APIs: they are much faster and much better at answering,
# and they send your transcribed speech to that company. Wake detection,
# speech-to-text and the voice always stay on this machine.
#
# Do not set these by hand - run `gideon --provider`. It stores the API key in
# ~/.config/gideon/credentials.toml (mode 0600) instead of here, because this
# file is world-readable, and it writes the choice to your user config.
#
# If the cloud provider is unreachable, out of credit or slow, Gideon falls back
# to the local model above, and then to canned replies. A dropped connection
# costs you the better model, not the assistant.
llm_provider  = "ollama"
cloud_model   = ""            # e.g. "llama3.1-8b", "meta-llama/llama-3.3-70b-instruct"
cloud_timeout = 12.0          # shorter than llm_timeout on purpose: this is speech

[tts]
voice = "en_US-lessac-medium"
speak_greeting_on_start = true

[log]
log_level = "INFO"
